<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Echo | Intelligence Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f9f9f7; --accent: #111; --border: #e2e2e0; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar { width: 320px; height: 100vh; position: fixed; left: 0; top: 0; border-right: 1px solid var(--border); padding: 30px 20px; background: white; }
        .main-content { margin-left: 320px; padding: 60px 80px; }
        .log-item { padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .log-item:hover { background: var(--bg); border-color: var(--border); }
        .briefing-card { background: white; border-radius: 12px; padding: 40px; border: 1px solid var(--border); margin-bottom: 30px; }
        .data-chip { display: inline-block; padding: 4px 12px; background: #f0f0f0; border: 1px solid #ddd; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin: 0 8px 8px 0; color: #444; }
        .section-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: #999; letter-spacing: 0.1em; display: block; margin-bottom: 10px; }
        .status-danger { color: #c0392b; } .status-warning { color: #d35400; } .status-success { color: #27ae60; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="mb-4">
            <span class="section-label">Intelligence Archive</span>
            <input type="text" id="searchInput" class="form-control form-control-sm mt-2 border-0 bg-light" placeholder="Search logs..." onkeyup="filterLogs()">
        </div>
        <div id="logContainer"></div>
    </aside>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="fw-800 m-0" style="letter-spacing: 0.1em;">ECHO / HUB</h1>
            <button onclick="downloadPDF()" id="pdfBtn" class="btn btn-outline-dark btn-sm hidden">EXPORT PDF</button>
        </div>

        <div class="d-flex gap-2 mb-5 p-2 bg-white rounded-3 border">
            <input type="file" id="audioFile" class="form-control border-0 shadow-none">
            <button onclick="runAnalysis()" id="procBtn" class="btn btn-dark btn-sm px-4">ANALYZE</button>
        </div>

        <div id="resultsArea" class="hidden">
            <div class="briefing-card">
                <span class="section-label">Executive Intelligence Brief</span>
                <p id="summaryText" class="fs-5 mb-4"></p>
                <span class="section-label">Identified Entities</span>
                <div id="keywordPills" class="mb-4"></div>
                <div class="pt-3 border-top"><span class="section-label">Priority Level</span><div id="priorityText" class="fw-bold"></div></div>
            </div>
            <span class="section-label px-2">Verified Transcript</span>
            <p id="transcriptText" class="px-2 text-muted" style="font-size: 0.9rem; line-height: 1.8;"></p>
        </div>
    </main>

    <script>
        let currentData = null;
        async function loadHistory() {
            const res = await fetch('/logs');
            const logs = await res.json();
            document.getElementById('logContainer').innerHTML = logs.map(l => `
                <div class="log-item" onclick="loadLog(${l.id})">
                    <div class="small fw-bold text-truncate">${l.filename}</div>
                    <div class="text-muted" style="font-size: 9px;">${l.timestamp}</div>
                </div>`).join('');
        }
        function filterLogs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            Array.from(document.getElementsByClassName('log-item')).forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }
        async function loadLog(id) {
            const res = await fetch(`/get_log/${id}`);
            displayResults(await res.json());
        }
        function displayResults(data) {
            currentData = data;
            document.getElementById('summaryText').innerText = data.summary;
            document.getElementById('transcriptText').innerText = data.transcript;
            document.getElementById('priorityText').innerText = data.priority;
            document.getElementById('priorityText').className = `fw-bold status-${data.color}`;
            document.getElementById('keywordPills').innerHTML = data.keywords.map(k => `<span class="data-chip">${k}</span>`).join('');
            document.getElementById('resultsArea').classList.remove('hidden');
            document.getElementById('pdfBtn').classList.remove('hidden');
        }
        async function runAnalysis() {
            const file = document.getElementById('audioFile').files[0];
            if(!file) return;
            const btn = document.getElementById('procBtn');
            btn.disabled = true; btn.innerText = "PROCESSING...";
            const fd = new FormData(); fd.append('audio', file);
            const res = await fetch('/upload', { method: 'POST', body: fd });
            displayResults(await res.json());
            loadHistory();
            btn.disabled = false; btn.innerText = "ANALYZE";
        }
        async function downloadPDF() {
            const res = await fetch('/download_pdf', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(currentData) });
            const blob = await res.blob();
            const a = document.createElement('a'); a.href = window.URL.createObjectURL(blob); a.download = `Report_${currentData.filename}.pdf`; a.click();
        }
        window.onload = loadHistory;
    </script>
</body>
</html>
